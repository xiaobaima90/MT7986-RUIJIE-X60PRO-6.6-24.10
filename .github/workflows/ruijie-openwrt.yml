name: Ruijie Openwrt Development

on:
  push:
    branches: [ "openwrt-24.10-6.6" ]
  pull_request:
    branches: [ "openwrt-24.10-6.6" ]
  workflow_dispatch:

permissions: 
  contents: write
  
env:
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  postmsg:
    name: Post Group Messages
    if: false
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Get Commit Info
      id: get_commit
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | xargs)
        COMMIT_AUTHOR=$(git log -1 --pretty=%an)
        echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_OUTPUT
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT

    - name: Send Messages
      id: request
      uses: tyrrrz/action-http-request@prime
      with:
        url: https://api.1tip.cc:8000/qqbot/send_group_msg
        method: POST
        headers: |
          Content-Type: application/json
          Authorization: ${{ secrets.ORG_QQ_BOOT_SECRET }}
        body: |
          {
              "group_id": "860015881",
              "message": [
                  {
                      "type": "text",
                      "data": {
                          "text": "【更新提示】\n检测到新的Github Action开发版构建实例，仓库名【${{ github.repository }}】，提交人【${{ steps.get_commit.outputs.COMMIT_AUTHOR }}】，更改内容【${{ steps.get_commit.outputs.COMMIT_MSG }}】，系统已开始构建，请耐心等待，构建完成后可于仓库的Release处下载。（如果长时间未生成Release，请召唤管理）\n"
                      }
                  }
              ]
          }
        retry-count: 3
        retry-delay: 500

    - name: Send Messages to Private Group
      id: request-private
      uses: tyrrrz/action-http-request@prime
      with:
        url: https://api.1tip.cc:8000/qqbot/send_group_msg
        method: POST
        headers: |
          Content-Type: application/json
          Authorization: ${{ secrets.ORG_QQ_BOOT_SECRET }}
        body: |
          {
              "group_id": ${{ secrets.ORG_QQ_PRVI_GROUP_NUM }},
              "message": [
                  {
                      "type": "text",
                      "data": {
                          "text": "【${{ github.repository }}】有新的Commit，提交人【${{ steps.get_commit.outputs.COMMIT_AUTHOR }}】，更改内容【${{ steps.get_commit.outputs.COMMIT_MSG }}】\n"
                      }
                  }
              ]
          }
        retry-count: 3
        retry-delay: 500

  cache-toolchain:
    name: Compile & Cache Toolchain
    runs-on: ubuntu-22.04
    steps:
    - name: Initialization Environment
      id: env
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
          libncursesw5-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
          lld lldb llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
          python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

        sudo apt-get clean
        sudo timedatectl set-timezone "$TZ"

    - name: Optimize Disk
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: Combine Disks
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout Repository
      id: checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0

    - name: Cache DL
      uses: actions/cache@v5
      with:
        path: dl
        key: mt798x-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('.github/workflows/cache-control') }}

    - name: Cache Feeds
      uses: actions/cache@v5
      with:
        path: feeds
        key: mt798x-feeds-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('.github/workflows/cache-control') }}

    - name: Cache Toolchain
      uses: RuijieNetworksCommunity/cache-wrt-toolchain@main
      with:
        mixkey: ${{ hashFiles('.github/workflows/cache-control') }}

    - name: Update Feeds
      id: update-feeds
      run: ./scripts/feeds update -a

    - name: Install Feeds
      id: install-feeds
      run: ./scripts/feeds install -a

    - name: Load Configuration
      id: load-config
      run: |
        [ -e defconfig/mt7986-ruijie-max.config ] && cp defconfig/mt7986-ruijie-max.config .config

    - name: Make Compile Configuration
      id: make-compile-config
      run: |
        make defconfig

    - name: Download Package
      id: download-package
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Toolchain
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(($(nproc) * 3 / 2)) toolchain/install || make -j1 toolchain/install || make -j1 V=s toolchain/install
        echo "status=success" >> $GITHUB_OUTPUT

  mt7986-max:
    name: MT7986 Max Build
    runs-on: ubuntu-22.04
    needs: [cache-toolchain]

    steps:
    - name: Initialization Environment
      id: env
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
          libncursesw5-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
          lld lldb llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
          python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

        sudo apt-get clean
        sudo timedatectl set-timezone "$TZ"

    - name: Optimize Disk
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: Combine Disks
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout Repository
      id: checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0

    - name: Cache DL
      uses: actions/cache@v5
      with:
        path: dl
        key: mt798x-dl-v4-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('.github/workflows/cache-control') }}

    - name: Cache Feeds
      uses: actions/cache@v5
      with:
        path: feeds
        key: mt798x-feeds-v4-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('.github/workflows/cache-control') }}

    - name: Cache Toolchain
      uses: RuijieNetworksCommunity/cache-wrt-toolchain@main
      with:
        mixkey: ${{ hashFiles('.github/workflows/cache-control') }}

    - name: Update Feeds
      id: update-feeds
      run: ./scripts/feeds update -a

    - name: Setup Go Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false

    - name: Upgrade HomeProxy & sing-box
      id: upgrade-packages
      run: |
        # 1. 将 Go 缓存与编译目录全部重定向到大容量工作区，避免撑爆系统根分区
        export GOPATH="$GITHUB_WORKSPACE/.go-cache"
        export GOCACHE="$GITHUB_WORKSPACE/.go-build"
        export GOTMPDIR="$GITHUB_WORKSPACE/.go-tmp"
        mkdir -p "$GOPATH" "$GOCACHE" "$GOTMPDIR"

        # 2. 清理旧版 homeproxy 并拉取最新 dev 分支
        find package/ feeds/ -maxdepth 4 -iname "*homeproxy*" -exec rm -rf {} +
        git clone --depth=1 -b dev https://github.com/immortalwrt/homeproxy.git package/luci-app-homeproxy

        # 3. 精确移除 HomeProxy Makefile 中对 sing-box 源码包的强制依赖
        sed -i -E 's/\+sing-box(-full|-tiny)?//g' package/luci-app-homeproxy/Makefile

        # 4. 获取 SagerNet 官方最新 sing-box 版本号并拉取源码裁剪编译
        LATEST_TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
        if [ -z "$LATEST_TAG" ]; then
          echo "获取最新版本失败，回退至稳定版 1.12.12"
          LATEST_TAG="1.12.12"
        fi
        echo "=== 开始源码裁剪编译 sing-box v${LATEST_TAG} ==="
        git clone --depth=1 -b "v${LATEST_TAG}" https://github.com/SagerNet/sing-box.git "$GITHUB_WORKSPACE/sing-box-src"

        # 5. 纯静态编译 linux/arm64 精简版（仅保留主力协议，剔除 Tor/Tailscale/WireGuard/ACME 等重型模块）
        cd "$GITHUB_WORKSPACE/sing-box-src"
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
          -v -trimpath \
          -tags "with_quic,with_utls,with_gvisor,with_clash_api" \
          -ldflags "-X github.com/sagernet/sing-box/constant.Version=${LATEST_TAG} -s -w -buildid=" \
          -o "$GITHUB_WORKSPACE/sing-box-bin" \
          ./cmd/sing-box

        # 6. 置入固件根目录并设 555 只读权限，随后彻底清理源码与 Go 缓存释放磁盘空间
        cd "$GITHUB_WORKSPACE"
        mkdir -p files/usr/bin
        cp "$GITHUB_WORKSPACE/sing-box-bin" files/usr/bin/sing-box
        chmod 555 files/usr/bin/sing-box
        rm -rf "$GITHUB_WORKSPACE/sing-box-src" "$GITHUB_WORKSPACE/sing-box-bin" "$GOPATH" "$GOCACHE" "$GOTMPDIR"

        # 7. 校验文件架构（静态链接）与体积（大于 10MB）
        file files/usr/bin/sing-box
        ls -lh files/usr/bin/sing-box
        SIZE=$(stat -c%s files/usr/bin/sing-box)
        if [ "$SIZE" -lt 10000000 ]; then
          echo "ERROR: sing-box 编译产物异常过小 ($SIZE bytes)，中止编译！"
          exit 1
        fi

    - name: Install Feeds
      id: install-feeds
      run: ./scripts/feeds install -a

    - name: Load Configuration
      id: load-config
      run: |
        [ -e defconfig/mt7986-ruijie-max.config ] && cp defconfig/mt7986-ruijie-max.config .config

    - name: Make Compile Configuration
      id: make-compile-config
      run: |
        # 彻底清除原配置中的源码版 sing-box 选项，避免与预置二进制文件冲突
        sed -i '/CONFIG_PACKAGE_sing-box/d' .config
        echo "CONFIG_PACKAGE_ca-bundle=y" >> .config
        echo "CONFIG_PACKAGE_ca-certificates=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-socket=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-tproxy=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-homeproxy=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y" >> .config
        echo "# CONFIG_PACKAGE_sing-box is not set" >> .config
        echo "# CONFIG_PACKAGE_sing-box-full is not set" >> .config
        echo "# CONFIG_PACKAGE_sing-box-tiny is not set" >> .config
        make defconfig

    - name: Download Package
      id: download-package
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(($(nproc) * 3 / 2)) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check Disk Space
      if: (!cancelled())
      run: df -hT

    - name: Upload Artifacts
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: mt7986-max-bin
        path: bin

  max-release:
    name: Publish MT7986 Max Release
    runs-on: ubuntu-22.04
    needs: [mt7986-max]

    steps:
    - name: Checkout Repository
      id: checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 2

    - name: Download MT7986 Max Artifacts
      id: download-mt7986
      if: (!cancelled())
      uses: actions/download-artifact@main
      with:
        name: mt7986-max-bin
        path: artifacts/mt7986

    - name: Organize Files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        mkdir -p release

        rm -rf artifacts/mt7986/packages

        find artifacts/mt7986/targets/mediatek/filogic/ -type f ! -name "*.bin" -delete
        find artifacts/mt7986/targets/mediatek/filogic/ -type f -name "*-bl2.bin" -delete
        find artifacts/mt7986/targets/mediatek/filogic/ -mindepth 1 -type d -exec rm -rf {} +

        cp -r artifacts/mt7986/targets/mediatek/filogic/*.bin release/

        cd release

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate Release TAG
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        SHORT_HASH=$(git rev-parse --short HEAD)
        BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD | tr '/' '-')
        echo "release_tag=R$(date +"%y.%-m.%-d.%H%M")-$SHORT_HASH-$BRANCH_NAME-max" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "## Changes:"
          echo ""
          git log -1 --pretty=format:"- %s (%h) by %an"
          echo ""
          echo "### Diff:"
          git diff --name-only HEAD^ HEAD | sed 's/^/- /'
        } > release.txt

        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        prerelease: true
